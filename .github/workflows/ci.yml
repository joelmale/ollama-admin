name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Fails if server-side coverage drops below the floors in vitest.config.ts.
      - run: npm run test:coverage
      - run: npx tsc --noEmit

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      # Lifecycle scripts stay off; prisma generate is the only one the app needs.
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run test:e2e:browsers
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build app image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ollama-admin:ci
          platforms: linux/amd64
      - name: Verify SQLite volume permissions
        run: bash scripts/test-sqlite-container.sh ollama-admin:ci
      - name: Build gpu-agent image (no push)
        if: hashFiles('gpu-agent/Dockerfile') != ''
        uses: docker/build-push-action@v7
        with:
          context: ./gpu-agent
          push: false
          platforms: linux/amd64
