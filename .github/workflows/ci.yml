name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit

  build-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build app image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ollama-admin:ci
          platforms: linux/amd64
      - name: Verify SQLite volume permissions
        run: bash scripts/test-sqlite-container.sh ollama-admin:ci
      - name: Build gpu-agent image (no push)
        if: hashFiles('gpu-agent/Dockerfile') != ''
        uses: docker/build-push-action@v7
        with:
          context: ./gpu-agent
          push: false
          platforms: linux/amd64
