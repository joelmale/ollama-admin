version: "3.9"

services:
  ollama-admin:
    image: ghcr.io/joelmale/ollama-admin:${VERSION:-0.15.8}
    pull_policy: missing
    # Repair the SQLite volume, then the entrypoint drops to UID/GID 1001.
    user: "0:0"
    build:
      context: .
      args:
        # Set when serving the app behind a reverse proxy at a sub-path
        # (e.g. NEXT_PUBLIC_BASE_PATH=/ollama-admin). Must be a build arg —
        # Next.js bakes basePath into the client bundle.
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    ports:
      - "3000:3000"
    # Required by Docker Engine on Linux/WSL; Docker Desktop provides it already.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/data/ollama-admin.db}
      DEFAULT_OLLAMA_URL: ${DEFAULT_OLLAMA_URL:-http://host.docker.internal:11434}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changeme}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
      CATALOG_REFRESH_ENABLED: ${CATALOG_REFRESH_ENABLED:-true}
    volumes:
      - ollama-admin-data:/data
    restart: unless-stopped

  # Optional: PostgreSQL (uncomment to use instead of SQLite)
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: ollamaadmin
  #     POSTGRES_PASSWORD: changeme
  #     POSTGRES_DB: ollamaadmin
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   restart: unless-stopped
  # Then set: DATABASE_URL=postgresql://ollamaadmin:changeme@postgres:5432/ollamaadmin

  # Optional: GPU monitoring agent
  # Set GPU_AGENT_URL to http://gpu-agent:11435 in your server config after enabling.
  #
  # NVIDIA (requires NVIDIA Container Toolkit on host):
  # gpu-agent:
  #   image: ghcr.io/joelmale/ollama-admin-gpu-agent:${VERSION:-latest}
  #   build: ./gpu-agent
  #   environment:
  #     GPU_BACKEND: nvidia
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   ports:
  #     - "11435:11435"
  #   restart: unless-stopped
  #
  # AMD (requires ROCm drivers on host):
  # gpu-agent:
  #   image: ghcr.io/joelmale/ollama-admin-gpu-agent:${VERSION:-latest}
  #   build: ./gpu-agent
  #   environment:
  #     GPU_BACKEND: amd
  #   devices:
  #     - /dev/kfd:/dev/kfd
  #     - /dev/dri:/dev/dri
  #   group_add:
  #     - video
  #     - render
  #   ports:
  #     - "11435:11435"
  #   restart: unless-stopped

volumes:
  ollama-admin-data:
  # postgres-data:
